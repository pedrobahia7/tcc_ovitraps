stages:
  convert_to_csv:
    cmd: python src/dvc/convert_to_csv.py
    deps:
      - src/dvc/convert_to_csv.py
      - ${all.paths.data.raw.health_centers}
      - ${all.paths.data.raw.dengue}
      - ${all.paths.data.raw.ovitraps}
      - ${all.paths.data.raw.ibge_2010_population}
      - ${all.paths.data.raw.ibge_2022_population}
      - ${all.paths.data.raw.ibge_sector_history}
    outs:
      - ${all.paths.data.dvc.convert_to_csv.health_centers_csv}:
          persist: true
      - ${all.paths.data.dvc.convert_to_csv.dengue_csv}:
          persist: true
      - ${all.paths.data.dvc.convert_to_csv.ovitraps_csv}:
          persist: true
      - ${all.paths.data.dvc.convert_to_csv.ibge_2010_population_csv}:
          persist: true
      - ${all.paths.data.dvc.convert_to_csv.ibge_2022_population_csv}:
          persist: true
      - ${all.paths.data.dvc.convert_to_csv.ibge_sector_history_csv}:
          persist: true

  process_data:
    cmd: python src/dvc/process_data.py
    deps:
      - src/dvc/process_data.py
      - ${all.paths.data.dvc.convert_to_csv.health_centers_csv}
      - ${all.paths.data.dvc.convert_to_csv.dengue_csv}
      - ${all.paths.data.dvc.convert_to_csv.ovitraps_csv}
    outs:
      - ${all.paths.data.dvc.process_data.health_centers}:
          persist: true
      - ${all.paths.data.dvc.process_data.dengue}:
          persist: true
      - ${all.paths.data.dvc.process_data.ovitraps}:
          persist: true
      - ${all.paths.data.dvc.process_data.daily_ovitraps}:
          persist: true

  process_population_data:
    cmd: python src/dvc/process_population_data.py
    deps:
      - src/dvc/process_population_data.py
      - ${all.paths.data.dvc.convert_to_csv.ibge_2010_population_csv}
      - ${all.paths.data.raw.ibge_2022_population}
      - ${all.paths.data.dvc.convert_to_csv.ibge_sector_history_csv}
      - ${all.paths.data.dvc.convert_to_csv.dengue_csv}
      - data/raw/IBGE/2010/shapefiles/
      - data/raw/IBGE/2022/shapefiles/MG_setores_CD2022.shp
      - data/raw/IBGE/2010/population/Base_informacoes_setores2010_sinopse_MG.xls
    outs:
      - ${all.paths.data.dvc.process_population_data.population_2010_to_2022}:
          persist: true
      - ${all.paths.data.dvc.process_population_data.sectors_geojson}:
          persist: true
      - ${all.paths.data.dvc.process_population_data.population_interpolated}:
          persist: true

  add_population_info:
    cmd: python src/dvc/add_population_info.py
    deps:
      - src/dvc/add_population_info.py
      - ${all.paths.data.dvc.process_data.ovitraps}
      - ${all.paths.data.dvc.process_data.dengue}
      - ${all.paths.data.dvc.process_population_data.sectors_geojson}
      - ${all.paths.data.dvc.process_population_data.population_interpolated}
    outs:
      - ${all.paths.data.dvc.add_population_info.ovitraps}
      - ${all.paths.data.dvc.add_population_info.dengue}
      - ${all.paths.data.dvc.add_population_info.dengue_per_capita}:
          persist: true
      - ${all.paths.data.dvc.add_population_info.centroids}:
          persist: true
      - ${all.paths.data.dvc.add_population_info.centroids_idw}:
          persist: true
      - ${all.paths.data.dvc.add_population_info.dengue_citywide_per_capita}:
          persist: true

  run_tests:
    cmd:
      - pytest test/data/raw/test_raw_data.py
      - pytest test/data/raw/test_raw_data_comparison.py
      - pytest test/data/processed/test_centroids.py
      - pytest test/data/processed/test_dengue_per_capita.py
      - pytest test/data/processed/test_processed_data.py
      - pytest test/utils/test_project_utils.py
    deps:
      - test/data/raw/test_raw_data.py
      - test/data/raw/test_raw_data_comparison.py
      - test/data/processed/test_centroids.py
      - test/data/processed/test_dengue_per_capita.py
      - test/data/processed/test_processed_data.py
      - test/utils/test_project_utils.py
      - utils/project_utils.py
      - utils/generic.py
      - ${all.paths.data.dvc.add_population_info.ovitraps}
      - ${all.paths.data.dvc.add_population_info.dengue}
      - ${all.paths.data.dvc.add_population_info.dengue_per_capita}
      - ${all.paths.data.dvc.add_population_info.centroids}
      - ${all.paths.data.dvc.add_population_info.centroids_idw}
    outs:
      - ${all.paths.test.data.raw.diagnosis_raw_comparison}:
          persist: true
      - ${all.paths.test.data.raw.diagnosis_raw_data}:
          persist: true

  mlp_baselines:
    cmd:
      - python -m src.multiscale.baselines
    params:
      - multiscale
      - skater_cv
    deps:
      - src/multiscale/
      - ${all.paths.data.dvc.add_population_info.dengue_per_capita}
      - ${all.paths.data.dvc.add_population_info.centroids_idw}
      - ${all.paths.data.dvc.process_population_data.sectors_geojson}
    outs:
      - results/multiscale/baselines/:
          persist: true

  skater:
    cmd:
      - python -m src.skater.run
      - python scripts/skater_dashboard.py
      - python scripts/skater_structure_dashboard.py
    params:
      - skater
    deps:
      - src/skater/
      - ${all.paths.data.dvc.add_population_info.centroids_idw}
      - ${all.paths.data.dvc.add_population_info.dengue_per_capita}
      - ${all.paths.data.dvc.process_population_data.sectors_geojson}
    outs:
      - results/skater/${skater.run_label}/:
          persist: true

  # Expensive, deterministic: per-fold SKATER partitions (skater-ALL
  # layout). Depends only on skater strategy + CV params — NOT the MLP —
  # so tuning the model never recomputes these.
  skater_cv_partitions:
    cmd:
      - python -m src.multiscale.skater_partitions
      - python scripts/skater_cv_concordance_dashboard.py
    params:
      - skater
      - skater_cv
    deps:
      - src/skater/
      - src/multiscale/skater_partitions.py
      - src/multiscale/config.py
      - scripts/skater_cv_concordance_dashboard.py
      - ${all.paths.data.dvc.add_population_info.dengue_per_capita}
      - ${all.paths.data.dvc.add_population_info.centroids_idw}
      - ${all.paths.data.dvc.process_population_data.sectors_geojson}
    outs:
      - results/multiscale/partitions/:
          persist: true

  # Cheap, frequently re-tuned: MLP per region from cached partitions +
  # the cross-scale trade-off dashboard. No SKATER rerun.
  skater_cv_models:
    cmd:
      - python -m src.multiscale.skater_cv_models
      - python scripts/multiscale_dashboard.py
    params:
      - skater
      - multiscale
      - skater_cv
    deps:
      - src/multiscale/
      - scripts/multiscale_dashboard.py
      - results/multiscale/partitions/
      - results/multiscale/baselines/
      - ${all.paths.data.dvc.add_population_info.dengue_per_capita}
      - ${all.paths.data.dvc.add_population_info.centroids_idw}
      - ${all.paths.data.dvc.process_population_data.sectors_geojson}
    outs:
      - results/multiscale/skater_cv/:
          persist: true
