skater_cv:
  # ── Cross-validation + per-fold SKATER stop (partition stage) ────────
  # fold_years — epidemic years for leave-one-year-out CV.  Each is held
  #   out once as the test fold; SKATER + MLP train on the rest.  Drives
  #   the per-fold SKATER partitions (held-out year strictly excluded
  #   from both MST cost and pruning).  Changing these re-runs partitions.
  fold_years:
    - "2015_16"
    - "2018_19"
    - "2023_24"

  # Per-fold SKATER stop overrides — override params.yaml[skater] so the
  #   sole rule is "run until C=30" (global-degradation early stop
  #   disabled — Q may decrease past its peak).  Main skater untouched.
  cv_stop_local_degradation: false
  cv_global_degradation_threshold: null
  cv_c_max: 30

multiscale:
  # ── Frozen MLP architecture (model stages only) ─────────────────────
  # Reused for every unit at every scale, no per-unit hyper-parameter
  #   search, so only spatial aggregation varies.  Changing these re-runs
  #   only the MLP stages, never the SKATER partitions.
  hidden_layer_sizes:
    - 32
    - 16
  alpha: 0.01
  max_iter: 5000

  # Feature lag windows (biweeks).  eb_lags = unit EB dengue-rate lags;
  #   egg_lags = unit IDW egg lags (incubation window).  Target is the
  #   current-biweek unit EB rate.  Plus week_sin/week_cos seasonality.
  eb_lags:
    - 1
    - 2
    - 3
  egg_lags:
    - 3
    - 4

  seed: 42

skater:
  # run_label — run's output subdirectory.
  #   Results are written to results/skater/<run_label>/.
  #   Change before each dvc repro to accumulate runs for concordance analysis.
  run_label: spearman_30
  
  # mst_cost — dissimilarity used to weight edges before Prim builds the MST.
  #   egg_corr_dist  : 1 − Pearson(eggs_i, eggs_j) over ALL biweeks.
  #                    Scale-invariant; preferred for eggs (more data).
  #   case_corr_dist : 1 − Pearson(dengue_i, dengue_j) over EPIDEMIC biweeks.
  #                    Scale-invariant; for cases-only runs.
  #   egg_spearman   : 1 − Spearman(eggs_i, eggs_j) over all biweeks.
  #                    Rank-based; robust to outliers, scale-invariant.
  #   case_spearman  : 1 − Spearman(dengue_i, dengue_j) over epidemic biweeks.
  #                    Rank-based; for cases-only runs.
  #   egg_euclidean  : ‖eggs_i − eggs_j‖₂ over all biweeks.
  #                    Scale-sensitive (Assunção 2006 paper-faithful, eggs).
  #   case_euclidean : ‖cases_i − cases_j‖₂ over epidemic biweeks.
  #                    Scale-sensitive (Assunção 2006 paper-faithful, cases).
  mst_cost: egg_spearman

  # prune_obj — objective maximised by greedy pruning (higher = better cut).
  #   corr_q          : best signed Pearson(eggs[t-k], dengue[t]) across lags k_min..k_max.
  #                     Custom objective coupling egg dynamics to epidemic timing.
  #   corr_q_spearman : best signed Spearman(eggs[t-k], dengue[t]) across lags.
  #                     Rank-based; robust to outliers in egg or case counts.
  #   egg_ssd         : −Σ_t Σ_s (eggs[s,t] − mean_t)².
  #                     Minimises within-cluster egg variance (Assunção 2006, eggs only).
  #   case_ssd        : −Σ_t Σ_s (dengue[s,t] − mean_t)².
  #                     Minimises within-cluster dengue variance (Assunção 2006, cases only).
  prune_obj: corr_q_spearman
  # k_min / k_max — lag search window (biweeks) for correlation objectives.
  #   The pruning objective tests every integer lag k in [k_min, k_max] and
  #   keeps the best signed correlation.  One biweek ≈ 2 weeks, so k=2..6
  #   covers a 4–12-week lead time of eggs before dengue onset.
  #   Only applies to corr_q / corr_q_spearman objectives; SSD objectives
  #   ignore these and always use lag=0.
  k_min: 2
  k_max: 6

  # ── Stopping conditions ──────────────────────────────────────────────
  # C_max — hard ceiling on number of clusters produced.
  #   integer : stop after producing this many clusters.
  #   null    : no ceiling; run until another condition fires.
  C_max: 30

  # stop_local_degradation — reject cuts where BOTH child clusters score
  #   below their parent (q_a < q_parent AND q_b < q_parent).
  #   Cuts that concentrate purity into one child are still allowed.
  #   false : disabled (default, backward-compatible).
  #   true  : acts as an additional per-cut guard; if every remaining
  #           cut is rejected the algorithm stops naturally.
  stop_local_degradation: true

  # global_degradation_threshold — stop when the best available cut
  #   would change global Q by less than this value (best_dQ < threshold).
  #   null  : condition disabled (default, backward-compatible).
  #   0.0   : stop as soon as any cut decreases Q.
  #   > 0   : require a minimum improvement per step.
  #   < 0   : tolerate mild degradation before stopping.
  global_degradation_threshold: 0


  # N_min — minimum valid (eggs, dengue) observation pairs a cluster must
  #   have after a cut.  Cuts that would leave either child below this are
  #   rejected.  For correlation objectives: counts (eggs[t-k], dengue[t])
  #   pairs that are both non-NaN across all epidemic biweeks and lags.
  #   For SSD objectives: counts non-NaN entries in the sector submatrix.
  N_min: 20

  # S_min — minimum number of census sectors per cluster after a cut.
  #   Prevents degenerate singletons or tiny fragments.  A cut that would
  #   leave either child with fewer than S_min sectors is always rejected,
  #   regardless of data density.
  S_min: 30

  # mst_min_overlap — minimum biweeks where both sectors have non-NaN eggs
  #   before computing the pairwise dissimilarity weight.  Below this, the
  #   edge weight falls back to 2.0 (maximum dissimilarity) so data-sparse
  #   pairs are pushed to the MST fringe and cut first.
  mst_min_overlap: 10

  # epidemic_years — dengue epidemic seasons used to filter biweeks.
  #   Biweeks whose label starts with one of these prefixes are kept as
  #   "epidemic biweeks" for the pruning objective and dengue data loading.
  #   Off-season dengue signal is too flat/noisy for a meaningful lag
  #   correlation.  Each entry matches the biweek column prefix format.
  epidemic_years:
    - "2012_13"
    - "2015_16"
    - "2018_19"
    - "2023_24"

  # seed — global random seed fixed for numpy and Python random.
  #   Ensures the MST (Prim's tie-breaking) and pruning (sorted-edge
  #   tie-breaking) are fully reproducible across runs.
  seed: 42
